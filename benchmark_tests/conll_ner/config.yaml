model:
  name: "/home/stlab/models/Llama-3.2-1B-Instruct"
  device: "cuda"
  token_lookahead: true   # lookahead engine (LA); false = boundary-strict baseline
  num_beams: 1            # 1 = greedy; >1 = beam search
  do_sample: false
  max_new_tokens: 128     # 4-field JSON, spans are short
  # length_penalty / early_stopping: se assenti si usano i default HF
  # (beam alle stesse condizioni del greedy). Decommentare per sperimentare.
  # length_penalty: 0.0
  # early_stopping: true

embedder:
  # Same encoder as the gloss benchmark
  name: "mixedbread-ai/mxbai-embed-large-v1"
  device: "cuda"

retrieval:
  n_examples: 10      # dynamic few-shot examples (most similar first)

paths:
  test_data: "data/test.csv"
  retrieval_pool: "data/retrieval_pool.parquet"
  taxonomy: "data/taxonomy.json"
  output_dir: "output"

run:
  checkpoint_every: 100
