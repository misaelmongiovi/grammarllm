model:
  name: "/home/stlab/models/Llama-3.2-1B-Instruct"
  device: "cuda"
  token_lookahead: true
  num_beams: 1            # overridden per run: 1 (greedy) or 3 (beam3)
  do_sample: false
  top_p: 1.0
  max_new_tokens: 100
  batch_size: 5

# 'pubchem' (jablonkagroup/pubchem-smiles-molecular-formula) or 'gdb17'
# (Pixelatory/GDB-17, the paper's dataset). Both are built by prepare_data.py
# into data/<dataset>/ with the same schema. Override with --dataset.
dataset: pubchem

paths:
  # resolved as data/<dataset>/<file>
  test_data: "test_2000.jsonl"
  few_shot: "few_shot_20.jsonl"
  # predictions land in output/<dataset>/<run_name>/, run_name defaulting
  # to f"beam{num_beams}"
  output_dir: "output"

run:
  checkpoint_every: 200
