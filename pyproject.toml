[project]
name = "grammarllm"
version = "0.5.0"
description = """
GrammarLLM is a powerful Python library for grammar-constrained text generation, built on top of pre-trained Transformer models.
It allows you to define and apply constraints via formal grammars, ideal for classification, vocabulary restriction, and structured generation.
"""
readme = { file = "grammarllm/README_PACKAGE.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Gabriele Tuccio"},
    { name = "Luana Bulla" },
    { name = "Maria Madonia" },
    { name = "Aldo Gangemi" },
    { name = "Misael Mongiovì" }
]
dependencies = [
    "regex",
    "torch",
    "transformers>=4.30.0",
    "rich",
    "pydantic>=2.12.5",
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
analysis = ["matplotlib"]
# Only for reproducing benchmark_tests/ — not needed to use the library.
bench = [
    "accelerate>=0.26.0",   # device_map sharding in wos/pipe_bench.py
    "datasets",             # CoNLL-2003 download
    "omegaconf",            # config.yaml loading
    "pandas",
    "pyarrow",              # parquet engine for the retrieval pools
    "python-dotenv",        # wos/wos_eval.py
    "sacrebleu",            # gloss BLEU/chrF
    "scikit-learn",         # wos F1 scoring
    "sentence-transformers",# mxbai retrieval encoder
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["grammarllm*"]
exclude = [
    "grammarllm.temp*",
    "grammarllm.tests*",
    "grammarllm.deprecated*",
    "grammarllm.modules.deprecated*",
    "grammarllm.modules.legacy*",
    "grammarllm.scripts.deprecated*",
]

[project.urls]
Homepage = "https://github.com/misaelmongiovi/grammarllm"
Repository = "https://github.com/misaelmongiovi/grammarllm"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121" }
]